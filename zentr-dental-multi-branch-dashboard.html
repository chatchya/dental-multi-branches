<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zentr Dental multi-branch control tower prototype">
  <title>Zentr Dental · Control Tower Prototype</title>
  <style>
    :root {
      --canvas: #f3f7f5;
      --surface: #ffffff;
      --surface-soft: #f8fbfa;
      --ink: #16362e;
      --ink-2: #315047;
      --muted: #6b7c75;
      --brand: #2d806d;
      --brand-deep: #1f6656;
      --brand-soft: #ddf4ec;
      --mint: #c7ede2;
      --warning: #b7791f;
      --warning-soft: #fff3d7;
      --danger: #b44c4c;
      --danger-soft: #fbe9e7;
      --info: #46739a;
      --info-soft: #eaf2f8;
      --c-collect: #0d8768;
      --c-out: #c8871a;
      --border: #dce6e1;
      --border-strong: #c7d7d0;
      --shadow: 0 16px 40px rgba(26, 58, 48, .07);
      --shadow-soft: 0 8px 24px rgba(26, 58, 48, .05);
      --radius-lg: 18px;
      --radius-md: 13px;
      --radius-sm: 9px;
      --focus: 0 0 0 3px rgba(45, 128, 109, .25);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }
    a { color: inherit; }

    .app { min-height: 100vh; display: flex; }
    .sidebar {
      width: 252px;
      flex: 0 0 252px;
      background: rgba(255, 255, 255, .86);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 22px 14px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 20;
    }
    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 10px 23px;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border: 2px solid var(--brand);
      border-radius: 11px;
      color: var(--brand);
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: -.08em;
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      background: var(--mint);
      border-radius: 50%;
      right: -4px;
      bottom: -3px;
      border: 2px solid var(--surface);
    }
    .brand-name { font-weight: 800; font-size: 16px; letter-spacing: -.02em; }
    .brand-edition { color: var(--muted); font-size: 11px; margin-top: 1px; }
    .nav-section { margin-top: 22px; }
    .nav-label {
      color: #8a9892;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      padding: 0 11px 8px;
    }
    .nav-list { display: grid; gap: 4px; }
    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 11px;
      border-radius: 11px;
      text-align: left;
      min-height: 42px;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .nav-item:hover { background: var(--surface-soft); color: var(--ink); }
    .nav-item.active { background: var(--brand-soft); color: var(--brand-deep); font-weight: 800; }
    .nav-item:active { transform: translateY(1px); }
    .nav-item .nav-icon { width: 19px; height: 19px; display: grid; place-items: center; flex: 0 0 19px; }
    .nav-item .nav-count {
      margin-left: auto;
      min-width: 22px;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--surface);
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
      text-align: center;
    }
    .nav-item.active .nav-count { background: rgba(255,255,255,.72); }
    .sidebar-spacer { flex: 1; }
    .sidebar-note {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      border-radius: var(--radius-md);
      padding: 12px;
      margin: 14px 4px;
    }
    .sidebar-note-title { font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
    .sidebar-note p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px 2px;
      border-top: 1px solid var(--border);
    }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
    .user-name { font-weight: 800; font-size: 12px; }
    .user-role { color: var(--muted); font-size: 11px; }

    .main { min-width: 0; flex: 1; }
    .topbar {
      height: 76px;
      background: rgba(255,255,255,.9);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 30px;
      position: sticky;
      top: 0;
      z-index: 15;
      backdrop-filter: blur(10px);
    }
    .mobile-menu { display: none; }
    .topbar-tenant { min-width: 180px; }
    .topbar-tenant strong { display: block; font-size: 13px; }
    .topbar-tenant span { display: block; font-size: 11px; color: var(--muted); }
    .branch-wrap { position: relative; }
    .branch-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      border-radius: 10px;
      min-height: 42px;
      padding: 6px 11px;
      min-width: 178px;
      text-align: left;
    }
    .branch-trigger:hover { border-color: var(--brand); }
    .branch-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex: 0 0 8px; }
    .branch-trigger-text { flex: 1; min-width: 0; }
    .branch-trigger-text strong { display: block; font-size: 12px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .branch-trigger-text small { display: block; color: var(--muted); font-size: 10px; margin-top: 1px; }
    .branch-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 246px;
      padding: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      box-shadow: var(--shadow);
    }
    .branch-menu[hidden] { display: none; }
    .branch-option {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 9px;
      border-radius: 9px;
      color: var(--ink-2);
    }
    .branch-option:hover, .branch-option.selected { background: var(--brand-soft); color: var(--brand-deep); }
    .branch-option .option-copy { flex: 1; }
    .branch-option strong { display: block; font-size: 12px; }
    .branch-option small { display: block; font-size: 10px; color: var(--muted); }
    .check { color: var(--brand); font-weight: 900; }
    .topbar-search {
      flex: 1;
      min-width: 160px;
      max-width: 520px;
      position: relative;
      margin-left: auto;
    }
    .topbar-search input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      border-radius: 10px;
      min-height: 42px;
      padding: 0 14px 0 38px;
      color: var(--ink);
    }
    .topbar-search input::placeholder { color: #8a9892; }
    .search-icon { position: absolute; left: 13px; top: 12px; color: var(--muted); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn, .primary-btn, .secondary-btn, .text-btn {
      border: 1px solid transparent;
      border-radius: 10px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      white-space: nowrap;
    }
    .icon-btn { width: 40px; padding: 0; border-color: var(--border); background: var(--surface); color: var(--muted); }
    .icon-btn:hover { color: var(--ink); border-color: var(--brand); }
    .primary-btn { background: var(--brand); color: #fff; font-weight: 800; box-shadow: 0 6px 16px rgba(45,128,109,.16); }
    .primary-btn:hover { background: var(--brand-deep); }
    .secondary-btn { background: var(--surface); color: var(--ink-2); border-color: var(--border); font-weight: 700; }
    .secondary-btn:hover { border-color: var(--brand); color: var(--brand-deep); }
    .text-btn { background: transparent; color: var(--brand-deep); padding-left: 0; padding-right: 0; font-weight: 800; min-height: 30px; }
    .text-btn:hover { color: var(--ink); }
    .small-btn { min-height: 32px; padding: 0 9px; border-radius: 8px; font-size: 12px; }
    .app-body { max-width: 1560px; margin: 0 auto; padding: 30px 34px 48px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: var(--brand); font-size: 10px; font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(25px, 3vw, 34px); line-height: 1.16; letter-spacing: -.04em; margin: 5px 0 7px; }
    h2 { font-size: 18px; line-height: 1.25; letter-spacing: -.025em; margin-bottom: 4px; }
    h3 { font-size: 14px; margin-bottom: 2px; }
    .page-subtitle { color: var(--muted); margin: 0; max-width: 680px; }
    .head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .context-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #c9e8dc;
      background: #effaf6;
      color: #286451;
      padding: 10px 13px;
      border-radius: 11px;
      margin-bottom: 18px;
      font-size: 12px;
    }
    .context-banner strong { font-weight: 900; }
    .context-banner .context-meta { margin-left: auto; color: #5e8276; font-size: 11px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: 0 0 8px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
    .filter-select { min-height: 36px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--ink-2); padding: 0 10px; }
    .segmented { display: inline-flex; padding: 3px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; }
    .segmented button { border: 0; min-height: 30px; padding: 0 10px; color: var(--muted); background: transparent; border-radius: 7px; font-size: 12px; }
    .segmented button.active { background: var(--ink); color: #fff; font-weight: 800; }
    .updated { color: var(--muted); font-size: 11px; margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }

    .metric-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metric-card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: left;
      box-shadow: var(--shadow-soft);
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    button.metric-card { width: 100%; color: inherit; }
    .metric-card:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: var(--shadow); }
    .metric-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--muted); font-size: 11px; }
    .metric-icon { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; color: var(--brand); background: var(--brand-soft); }
    .metric-value { font-size: 28px; font-weight: 900; letter-spacing: -.05em; line-height: 1.05; margin: 15px 0 5px; }
    .metric-note { color: var(--muted); font-size: 11px; }
    .metric-note strong { color: var(--brand-deep); }

    .grid-2 { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(360px, .92fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); }
    .card-pad { padding: 19px; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .card-head p { color: var(--muted); font-size: 12px; margin: 3px 0 0; }
    .section-kicker { color: var(--muted); font-size: 11px; }
    .action-link { color: var(--brand-deep); font-size: 12px; font-weight: 800; border: 0; background: transparent; padding: 0; }
    .action-link:hover { color: var(--ink); }
    .task-list { display: grid; gap: 9px; }
    .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-top: 1px solid var(--border); }
    .task-item:first-child { padding-top: 0; border-top: 0; }
    .task-marker { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); margin-top: 7px; flex: 0 0 8px; }
    .task-marker.danger { background: var(--danger); }
    .task-marker.info { background: var(--info); }
    .task-copy { flex: 1; min-width: 0; }
    .task-copy strong { display: block; font-size: 12px; }
    .task-copy span { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .task-owner { color: var(--brand-deep); font-size: 11px; font-weight: 800; white-space: nowrap; }
    .branch-table { display: grid; gap: 8px; }
    .branch-row { display: grid; grid-template-columns: minmax(130px, 1.3fr) repeat(4, minmax(52px, .65fr)) 74px; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
    .branch-row.header { border-top: 0; padding-top: 0; color: var(--muted); font-size: 10px; font-weight: 800; }
    .branch-row > div:not(:first-child) { text-align: right; }
    .branch-name { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 12px; }
    .branch-swatch { width: 9px; height: 9px; border-radius: 3px; background: var(--brand); }
    .branch-meta { display: block; font-size: 10px; color: var(--muted); font-weight: 500; }
    .number { font-weight: 800; font-size: 12px; }
    .number.warning { color: var(--warning); }
    .number.danger { color: var(--danger); }
    .tiny-status { color: var(--muted); font-size: 10px; text-align: right; }
    .mini-timeline { display: grid; gap: 0; }
    .timeline-row { display: grid; grid-template-columns: 54px 1fr; gap: 12px; min-height: 64px; }
    .timeline-time { color: var(--muted); font-size: 11px; padding-top: 12px; }
    .timeline-event { border-left: 1px solid var(--border-strong); padding: 8px 0 12px 15px; position: relative; }
    .timeline-event::before { content: ""; position: absolute; width: 8px; height: 8px; background: var(--surface); border: 2px solid var(--brand); border-radius: 50%; left: -5px; top: 12px; }
    .timeline-event strong { display: block; font-size: 12px; }
    .timeline-event span { display: block; color: var(--muted); font-size: 11px; }
    .event-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .badge, .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 23px;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
    .badge { background: var(--surface-soft); border: 1px solid var(--border); color: var(--muted); }
    .status.confirmed, .status.done { color: #26715c; background: var(--brand-soft); }
    .status.pending { color: #946619; background: var(--warning-soft); }
    .status.cancelled, .status.risk { color: #a34444; background: var(--danger-soft); }
    .status.info { color: #3e6888; background: var(--info-soft); }
    .status.neutral { color: var(--muted); background: #eef2f0; }
    .insight-strip { display: flex; align-items: flex-start; gap: 11px; border: 1px solid #e7dfbd; background: #fffaf0; border-radius: 12px; padding: 12px; margin-top: 14px; }
    .insight-icon { color: var(--warning); background: var(--warning-soft); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; flex: 0 0 28px; }
    .insight-strip strong { display: block; font-size: 12px; }
    .insight-strip span { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .insight-strip .action-link { margin-left: auto; padding-top: 4px; }
    .bar-chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 9px; height: 142px; align-items: end; padding-top: 18px; }
    .bar-col { display: grid; gap: 6px; justify-items: center; height: 100%; align-items: end; }
    .bar { width: 100%; max-width: 27px; background: var(--mint); border-radius: 6px 6px 3px 3px; min-height: 10px; }
    .bar.current { background: var(--brand); }
    .bar-col span { color: var(--muted); font-size: 10px; }
    .chart-legend { display: flex; gap: 12px; color: var(--muted); font-size: 10px; margin-top: 10px; }
    .chart-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; background: var(--mint); margin-right: 4px; }
    .chart-legend i.current { background: var(--brand); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 13px; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 12px 13px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
    th { color: var(--muted); font-size: 10px; font-weight: 900; background: var(--surface-soft); white-space: nowrap; }
    td { font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfdfc; }
    .person-cell strong { display: block; font-size: 12px; }
    .person-cell span { display: block; color: var(--muted); font-size: 10px; }
    .clickable-row { cursor: pointer; }
    .compact-card { padding: 16px; }
    .page-section { margin-top: 18px; }
    .page-section-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 11px; gap: 12px; }
    .page-section-head p { color: var(--muted); font-size: 12px; margin: 3px 0 0; }

    .schedule-layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; }
    .schedule-board { overflow: hidden; }
    .schedule-header { display: grid; grid-template-columns: 170px repeat(5, minmax(100px, 1fr)); border-bottom: 1px solid var(--border); background: var(--surface-soft); min-width: 720px; }
    .schedule-header div { padding: 12px 10px; color: var(--muted); font-size: 10px; font-weight: 900; border-left: 1px solid var(--border); }
    .schedule-header div:first-child { border-left: 0; }
    .resource-row { display: grid; grid-template-columns: 170px repeat(5, minmax(100px, 1fr)); min-width: 720px; min-height: 90px; border-bottom: 1px solid var(--border); }
    .resource-row:last-child { border-bottom: 0; }
    .resource-label { padding: 13px 12px; border-right: 1px solid var(--border); }
    .resource-label strong { display: block; font-size: 12px; }
    .resource-label span { color: var(--muted); font-size: 10px; }
    .resource-cell { padding: 7px; border-right: 1px dashed var(--border); background: #fff; }
    .resource-cell:last-child { border-right: 0; }
    .appointment-card { width: 100%; min-height: 72px; text-align: left; padding: 9px; border: 1px solid #bde5d7; background: #f0fbf7; border-radius: 10px; color: var(--ink); }
    .appointment-card.pending { border-color: #efd28f; background: #fff9e9; }
    .appointment-card:hover { border-color: var(--brand); }
    .appointment-card strong { display: block; font-size: 11px; line-height: 1.3; }
    .appointment-card span { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
    .schedule-aside { display: grid; gap: 12px; align-content: start; }
    .legend-list { display: grid; gap: 9px; }
    .legend-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--brand); }
    .legend-swatch.pending { background: #e7bf58; }
    .legend-swatch.completed { background: #8aa19a; }
    .legend-swatch.block { background: #d5ded9; }
    .queue-grid { display: grid; grid-template-columns: repeat(5, minmax(190px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
    .queue-column { min-width: 190px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .queue-column-head { display: flex; justify-content: space-between; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .queue-column-head strong { font-size: 12px; }
    .queue-column-head span { color: var(--muted); font-size: 11px; }
    .queue-cards { display: grid; gap: 8px; margin-top: 10px; }
    .queue-card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 10px; }
    .queue-card strong { display: block; font-size: 11px; }
    .queue-card span { display: block; color: var(--muted); font-size: 10px; }
    .queue-actions { display: flex; gap: 5px; margin-top: 8px; }

    .patient-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
    .patient-list { display: grid; gap: 8px; }
    .patient-item { width: 100%; display: flex; align-items: center; gap: 11px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: inherit; }
    .patient-item:hover, .patient-item.selected { border-color: var(--brand); background: #fbfefc; }

    .protected-box { margin-top: 16px; border: 1px solid #d8e1df; background: #f5f8f7; border-radius: 11px; padding: 11px; }

    .timeline-mini { margin-top: 18px; display: grid; gap: 0; }

    .timeline-mini-item span { display: block; color: var(--muted); font-size: 10px; }

    .lab-board { display: grid; grid-template-columns: repeat(5, minmax(190px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
    .lab-column { min-width: 190px; }
    .lab-column-header { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 3px 2px 10px; }
    .lab-column-header strong { font-size: 12px; }
    .lab-column-header span { color: var(--muted); font-size: 11px; }
    .lab-list { display: grid; gap: 9px; }
    .lab-card { border: 1px solid var(--border); background: var(--surface); border-radius: 13px; padding: 12px; box-shadow: var(--shadow-soft); }
    .lab-card.risk { border-color: #eec8c4; background: #fffafa; }
    .lab-card-head { display: flex; justify-content: space-between; gap: 7px; align-items: flex-start; }

    .lab-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 11px 0; }
    .lab-date { border: 1px solid var(--border); background: var(--surface-soft); border-radius: 8px; padding: 6px; }
    .lab-date span { display: block; color: var(--muted); font-size: 9px; }
    .lab-date strong { display: block; margin-top: 2px; font-size: 11px; }
    .lab-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .risk-copy { color: var(--danger); font-size: 10px; font-weight: 800; }

    .finance-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .finance-metric { padding: 15px; border: 1px solid var(--border); background: var(--surface); border-radius: 13px; }
    .finance-metric span { color: var(--muted); font-size: 11px; }
    .finance-metric strong { display: block; font-size: 23px; margin-top: 8px; letter-spacing: -.04em; }
    .aging-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 13px; }
    .aging-item { border: 1px solid var(--border); background: var(--surface-soft); border-radius: 9px; padding: 9px; }
    .aging-item span { display: block; color: var(--muted); font-size: 10px; }
    .aging-item strong { display: block; margin-top: 3px; font-size: 14px; }
    .df-breakdown { display: grid; gap: 9px; }
    .df-line { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 11px; }
    .df-line:last-child { border-bottom: 0; }
    .df-line span { color: var(--muted); }
    .df-total { font-size: 16px; font-weight: 900; color: var(--brand-deep); }
    /* --- SVG stacked chart (revenue / collection / outstanding) --- */
    .zchart-wrap { position: relative; margin-top: 6px; }
    .zchart { width: 100%; height: auto; display: block; }
    .zcol { cursor: pointer; }
    .zcol:hover .zseg { filter: brightness(1.07); }
    .ztip { position: absolute; pointer-events: none; opacity: 0; transform: translate(-50%, -110%); background: var(--ink); color: #fff; border-radius: 10px; padding: 9px 12px; font-size: 11px; min-width: 158px; box-shadow: var(--shadow); z-index: 6; transition: opacity .12s ease; }
    .ztip.show { opacity: 1; }
    .ztip .zt-m { font-weight: 800; margin-bottom: 5px; }
    .ztip .zt-r { display: flex; justify-content: space-between; gap: 14px; line-height: 1.75; }
    .ztip .zt-r i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 6px; }
    .ztip .zt-sep { margin-top: 4px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,.2); }
    .zlegend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 2px; font-size: 11px; }
    .zlegend span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
    .zlegend i { width: 11px; height: 11px; border-radius: 3px; }
    /* --- aging segmented bar --- */

    .age-bar i { height: 100%; }
    .age-legend { display: flex; flex-direction: column; gap: 8px; }
    .age-row { display: flex; align-items: center; gap: 9px; font-size: 12px; }
    .age-sw { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px; }

    .age-row strong { margin-left: auto; font-size: 12px; }
    .age-pc { color: var(--muted); font-size: 11px; width: 34px; text-align: right; }
    /* --- DF review table + cross-branch + approval --- */
    .df-table .df-flag { color: var(--warning); font-weight: 700; font-size: 11px; }
    .xbranch .xrow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
    .xbranch .xrow:last-child { border-bottom: 0; }
    .xbranch .xrow span { color: var(--muted); }
    .xbranch .xrow strong { color: var(--ink-2); text-align: right; }
    .fin-delta { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; }
    .fin-delta.up { color: #26715c; background: var(--brand-soft); }
    .fin-delta.down { color: #a34444; background: var(--danger-soft); }
    .approval-strip { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px dashed var(--border-strong); border-radius: 13px; background: var(--surface-soft); margin: 16px 18px 18px; }
    .approval-strip .ap-ba { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .approval-strip .ap-old { color: var(--muted); text-decoration: line-through; }
    .approval-strip .ap-new { color: var(--brand-deep); font-weight: 900; }
    /* --- Reports: tabs, metadata, compare bars --- */
    .rtabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 15px; border-bottom: 1px solid var(--border); }
    .rtab { padding: 9px 15px; font-weight: 700; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; border-radius: 8px 8px 0 0; }

    .rmeta { display: flex; flex-wrap: wrap; gap: 7px 20px; padding: 11px 15px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 11px; margin-bottom: 15px; font-size: 11px; color: var(--muted); }

    .hbar-row { display: grid; grid-template-columns: 96px 1fr 52px; align-items: center; gap: 11px; margin-bottom: 11px; }
    .hbar-row .hbar-lbl { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; }
    .hbar-row .hbar-lbl i { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 9px; }
    .hbar-track { height: 10px; background: var(--surface-soft); border-radius: 99px; overflow: hidden; }
    .hbar-track i { display: block; height: 100%; border-radius: 99px; }
    .hbar-row b { text-align: right; font-size: 12px; }
    .pending-def { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; letter-spacing: .03em; color: #3e6888; background: var(--info-soft); padding: 2px 8px; border-radius: 99px; }

    .inbox-layout { display: grid; grid-template-columns: 286px minmax(0, 1fr) 300px; gap: 0; min-height: 610px; overflow: hidden; }
    .inbox-list, .inbox-context { background: var(--surface-soft); }
    .inbox-list { border-right: 1px solid var(--border); }
    .inbox-context { border-left: 1px solid var(--border); }
    .inbox-list-head, .inbox-context-head { padding: 16px; border-bottom: 1px solid var(--border); }
    .inbox-list-head strong, .inbox-context-head strong { font-size: 12px; }
    .inbox-filter { margin-top: 10px; width: 100%; }
    .inbox-item { width: 100%; padding: 13px 15px; border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; color: inherit; }
    .inbox-item:hover, .inbox-item.selected { background: var(--surface); }
    .inbox-item-top { display: flex; justify-content: space-between; gap: 7px; align-items: center; }
    .inbox-item-top strong { font-size: 11px; }
    .inbox-item-top time { color: var(--muted); font-size: 10px; }
    .inbox-item p { margin: 4px 0; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inbox-item-meta { display: flex; gap: 5px; flex-wrap: wrap; }
    .conversation { background: var(--surface); display: flex; flex-direction: column; min-width: 0; }
    .conversation-head { padding: 16px 19px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .conversation-head h2 { margin: 0; font-size: 16px; }
    .conversation-head p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .chat-body { padding: 19px; display: grid; gap: 12px; align-content: start; flex: 1; background: #fbfdfc; }
    .chat-bubble { max-width: 74%; padding: 11px 13px; border-radius: 13px; font-size: 12px; }
    .chat-bubble.incoming { background: var(--surface); border: 1px solid var(--border); justify-self: start; border-top-left-radius: 5px; }
    .chat-bubble.outgoing { background: var(--brand-soft); border: 1px solid #c9e8dc; justify-self: end; border-top-right-radius: 5px; }
    .chat-bubble small { display: block; color: var(--muted); font-size: 9px; margin-top: 5px; }
    .ai-draft { border: 1px solid #d8e6e1; background: var(--surface); border-radius: 12px; padding: 12px; margin-top: auto; }
    .ai-draft-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ai-draft-head strong { font-size: 11px; }
    .ai-draft p { color: var(--ink-2); font-size: 11px; margin: 9px 0; }
    .ai-draft-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .safe-banner { margin: 15px 16px 0; border: 1px solid #e7dfbd; background: #fffaf0; color: #7f5a16; border-radius: 10px; padding: 9px 10px; font-size: 10px; line-height: 1.45; }
    .context-block { padding: 16px; border-bottom: 1px solid var(--border); }
    .context-block:last-child { border-bottom: 0; }
    .context-block h3 { font-size: 11px; margin-bottom: 9px; }
    .context-line { display: flex; justify-content: space-between; gap: 10px; font-size: 10px; padding: 5px 0; }
    .context-line span { color: var(--muted); }
    .context-line strong { text-align: right; }

    .settings-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr); gap: 16px; }
    .branch-settings { display: grid; gap: 10px; }
    .branch-setting { display: flex; gap: 13px; align-items: flex-start; border: 1px solid var(--border); border-radius: 13px; padding: 13px; }
    .branch-setting:hover { border-color: var(--brand); }
    .branch-setting .branch-swatch { width: 12px; height: 12px; margin-top: 4px; }
    .branch-setting-main { flex: 1; min-width: 0; }
    .branch-setting-main strong { display: block; font-size: 12px; }
    .branch-setting-main p { color: var(--muted); font-size: 10px; margin: 3px 0 8px; }
    .setting-meta { display: flex; gap: 5px; flex-wrap: wrap; }
    .access-table table { min-width: 620px; }
    .permission-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--brand-deep); }
    .permission-pill.restricted { color: var(--muted); }
    .policy-list { display: grid; gap: 9px; }
    .policy-row { display: flex; align-items: flex-start; gap: 9px; padding: 10px 0; border-top: 1px solid var(--border); }
    .policy-row:first-child { border-top: 0; padding-top: 0; }
    .policy-row strong { display: block; font-size: 11px; }
    .policy-row span { display: block; color: var(--muted); font-size: 10px; }
    .policy-icon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 8px; background: var(--info-soft); color: var(--info); flex: 0 0 27px; }

    .empty-state { border: 1px dashed var(--border-strong); border-radius: 13px; padding: 30px; text-align: center; color: var(--muted); }
    .empty-state strong { display: block; color: var(--ink-2); font-size: 13px; margin-bottom: 4px; }
    .empty-state p { margin: 0 auto 12px; font-size: 11px; max-width: 360px; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(16, 39, 32, .35); z-index: 100; display: grid; place-items: center; padding: 20px; }
    .modal-backdrop[hidden] { display: none; }
    .modal-panel { width: min(540px, 100%); max-height: min(760px, 90vh); overflow: auto; background: var(--surface); border-radius: 18px; border: 1px solid var(--border); box-shadow: 0 24px 80px rgba(16,39,32,.22); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 21px 15px; border-bottom: 1px solid var(--border); }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .modal-head p { color: var(--muted); font-size: 11px; margin: 4px 0 0; }
    .modal-body { padding: 19px 21px 21px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .detail-item { border: 1px solid var(--border); background: var(--surface-soft); border-radius: 10px; padding: 10px; }
    .detail-item span { display: block; color: var(--muted); font-size: 10px; }
    .detail-item strong { display: block; font-size: 12px; margin-top: 3px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .modal-note { border: 1px solid #e7dfbd; background: #fffaf0; color: #7f5a16; border-radius: 10px; padding: 10px; font-size: 11px; margin-top: 14px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 200; background: var(--ink); color: #fff; border-radius: 10px; padding: 11px 14px; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .prototype-footer { color: var(--muted); font-size: 10px; text-align: center; margin-top: 28px; }

    /* Executive overview: decision support first, daily operation second. */
    .exec-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 18px 0 13px; }
    .exec-toolbar-copy { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; }
    .exec-toolbar-copy strong { color: var(--ink-2); font-size: 12px; }
    .exec-toolbar-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .executive-metrics { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .exec-metric { text-align: left; }
    .exec-metric .metric-value { letter-spacing: -.05em; }
    .exec-metric .metric-note { min-height: 29px; }
    .exec-content-grid { grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); margin-top: 16px; }
    .exec-card { min-width: 0; }
    .exec-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .exec-card-head h2 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
    .exec-card-head p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .exec-legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 10px; }
    .exec-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .exec-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--brand); }
    .exec-legend i.alt { background: #a9d8c8; }
    .exec-bars { height: 178px; display: grid; grid-template-columns: repeat(6, minmax(38px, 1fr)); align-items: end; gap: 13px; padding: 7px 6px 0; border-bottom: 1px solid var(--border); background: var(--surface); }
    .exec-bar-group { height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 4px; position: relative; }
    .exec-bar { width: 14px; border-radius: 5px 5px 0 0; background: var(--brand); min-height: 8px; }
    .exec-bar.alt { background: #a9d8c8; }
    .exec-bar-label { position: absolute; bottom: -22px; color: var(--muted); font-size: 9px; white-space: nowrap; }
    .exec-chart-note { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; color: var(--muted); font-size: 10px; }
    .exec-chart-note strong { color: var(--ink-2); font-size: 12px; }
    .exec-decision-list { display: grid; gap: 3px; }
    .exec-decision { display: grid; grid-template-columns: 29px minmax(0, 1fr) auto; gap: 9px; align-items: start; padding: 11px 0; border-top: 1px solid var(--border); }
    .exec-decision:first-child { border-top: 0; padding-top: 0; }
    .exec-decision-icon { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 9px; color: var(--warning); background: var(--warning-soft); }
    .exec-decision-icon.danger { color: var(--danger); background: var(--danger-soft); }
    .exec-decision-icon.info { color: var(--info); background: var(--info-soft); }
    .exec-decision strong { display: block; font-size: 11px; line-height: 1.35; }
    .exec-decision p { margin: 3px 0 0; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .exec-decision .action-link { margin-top: 2px; white-space: nowrap; }
    .exec-branch-card { margin-top: 16px; }
    .exec-branch-card .table-wrap { border-radius: 12px; }
    .exec-branch-card table { min-width: 900px; }
    .exec-branch-card th, .exec-branch-card td { padding: 11px 12px; }
    .exec-branch-name { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .exec-branch-name .branch-dot { width: 9px; height: 9px; }
    .exec-branch-health { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .exec-branch-health small { color: var(--muted); font-size: 9px; }
    .exec-lower-grid { margin-top: 16px; align-items: stretch; }
    .exec-funnel { display: grid; gap: 11px; }
    .exec-funnel-row { display: grid; grid-template-columns: 90px minmax(0, 1fr) 36px; gap: 9px; align-items: center; font-size: 10px; }
    .exec-funnel-row > span:first-child { color: var(--muted); }
    .exec-funnel-row strong { text-align: right; font-size: 11px; }
    .exec-funnel-track { height: 9px; background: var(--surface-soft); border-radius: 99px; overflow: hidden; }
    .exec-funnel-track i { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
    .exec-funnel-track i.alt { background: #72bca7; }
    .exec-funnel-track i.warn { background: var(--warning); }
    .exec-risk-list { display: grid; gap: 9px; }
    .exec-risk-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding-bottom: 9px; border-bottom: 1px solid var(--border); }
    .exec-risk-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .exec-risk-row strong { display: block; font-size: 11px; }
    .exec-risk-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .exec-risk-row .status { flex: 0 0 auto; }
    .exec-ops-card { border-style: dashed; background: #fbfdfc; }
    .exec-ops-card .ops-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .exec-ops-card .ops-link { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink-2); padding: 10px; text-align: left; }
    .exec-ops-card .ops-link:hover { border-color: var(--brand); color: var(--brand-deep); }
    .exec-ops-card .ops-link strong { font-size: 10px; }
    .exec-ops-card .ops-link span { color: var(--muted); font-size: 9px; }
    .exec-data-note { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }

    @media (max-width: 1240px) {
      .metric-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    // stacked column chart: collection (green) + outstanding (amber) = revenue
    function stackedChart(id, rev, col) {
      const W = 680, H = 232, padL = 42, padR = 12, padT = 14, padB = 30;
      const plotW = W - padL - padR, plotH = H - padT - padB, base = padT + plotH;
      const maxV = Math.max(...rev);
      const step = maxV > 1000 ? 500 : 200;
      const niceMax = Math.max(step, Math.ceil(maxV / step) * step);
      const inM = niceMax >= 1000;
      const y = v => base - (v / niceMax) * plotH;
      const band = plotW / rev.length, bw = Math.min(40, band * 0.5);
      chartRegistry[id] = { rev, col, geo: { padL, padT, plotH, base, band, W, niceMax } };
      let g = "";
      for (let t = 0; t <= 4; t++) {
        const val = niceMax * t / 4, yy = y(val);
        g += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"${t ? "" : ' stroke-opacity="0"'}/>`;
        g += `<text x="${padL - 8}" y="${(yy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${inM ? (val / 1000).toFixed(1) : val}</text>`;
      }
      g += `<text x="${padL - 8}" y="${padT - 3}" text-anchor="end" font-size="9" fill="var(--muted)">${inM ? "ล้าน฿" : "พัน฿"}</text>`;
      for (let i = 0; i < rev.length; i++) {
        const cx = padL + band * i + band / 2, x = cx - bw / 2;
        const yCol = y(col[i]), hCol = base - yCol;
        const outTop = y(rev[i]), outBottom = yCol - 2, hOut = Math.max(0, outBottom - outTop);
        g += `<g class="zcol" data-i="${i}">`;
        g += `<rect x="${(padL + band * i).toFixed(1)}" y="${padT}" width="${band.toFixed(1)}" height="${plotH}" fill="transparent"/>`;
        g += `<rect class="zseg" x="${x.toFixed(1)}" y="${yCol.toFixed(1)}" width="${bw.toFixed(1)}" height="${hCol.toFixed(1)}" rx="2" fill="var(--c-collect)"/>`;
        if (hOut > 0.5) g += `<rect class="zseg" x="${x.toFixed(1)}" y="${outTop.toFixed(1)}" width="${bw.toFixed(1)}" height="${hOut.toFixed(1)}" rx="4" fill="var(--c-out)"/>`;
        g += `</g>`;
        g += `<text x="${cx.toFixed(1)}" y="${base + 18}" text-anchor="middle" font-size="11" fill="var(--muted)">${MLAB6[i]}</text>`;
      }
      return `<div class="zchart-wrap"><svg class="zchart" data-chart="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟรายรับ รับชำระ และยอดค้าง 6 เดือน (ข้อมูลตัวอย่าง)">${g}</svg><div class="ztip" data-tip="${id}"></div></div>`;
    }

    function agingBar(a) {
      const rows = [["ยังไม่เกินกำหนด", a.c, "var(--brand)"], ["1–7 วัน", a.d7, "var(--info)"], ["8–30 วัน", a.d30, "var(--c-out)"], ["เกิน 30 วัน", a.o30, "var(--danger)"]];
      const total = rows.reduce((s, r) => s + r[1], 0);
      return `<div class="age-bar">${rows.map(r => `<i style="background:${r[2]};flex:${r[1]} 0 0" title="${r[0]}"></i>`).join("")}</div>`
        + `<div class="age-legend">${rows.map(r => `<div class="age-row"><span class="age-sw" style="background:${r[2]}"></span><span class="age-nm">${r[0]}</span><strong>฿ ${r[1].toFixed(1)}k</strong><span class="age-pc">${total ? Math.round(r[1] / total * 100) : 0}%</span></div>`).join("")}</div>`;
    }

    function bindCharts(root) {
      Object.keys(chartRegistry).forEach(id => {
        const svg = root.querySelector(`.zchart[data-chart="${id}"]`);
        if (!svg) return;
        const reg = chartRegistry[id], wrap = svg.closest(".zchart-wrap"), tip = wrap.querySelector(`.ztip[data-tip="${id}"]`);
        svg.querySelectorAll(".zcol").forEach(gEl => {
          const i = Number(gEl.dataset.i), gg = reg.geo;
          const move = () => {
            const sr = svg.getBoundingClientRect(), wr = wrap.getBoundingClientRect(), scale = sr.width / gg.W;
            const cx = gg.padL + gg.band * i + gg.band / 2, yTop = gg.base - (reg.rev[i] / gg.niceMax) * gg.plotH;
            tip.style.left = `${(sr.left - wr.left) + cx * scale}px`;
            tip.style.top = `${(sr.top - wr.top) + yTop * scale}px`;
            tip.innerHTML = `<div class="zt-m">${MLAB6[i]} 2569</div>`
              + `<div class="zt-r"><span><i style="background:var(--c-collect)"></i>รับชำระ</span><b>${fmtK(reg.col[i])}</b></div>`
              + `<div class="zt-r"><span><i style="background:var(--c-out)"></i>ยอดค้าง</span><b>${fmtK(reg.rev[i] - reg.col[i])}</b></div>`
              + `<div class="zt-r zt-sep"><span>รายรับรวม</span><b>${fmtK(reg.rev[i])}</b></div>`
              + `<div class="zt-r"><span>อัตราเก็บเงิน</span><b>${(reg.rev[i] ? reg.col[i] / reg.rev[i] * 100 : 0).toFixed(1)}%</b></div>`;
            tip.classList.add("show");
          };
          gEl.addEventListener("mousemove", move);
          gEl.addEventListener("mouseenter", move);
          gEl.addEventListener("mouseleave", () => tip.classList.remove("show"));
        });
      });
    }

btn" data-action="open-plan">เปิดรายละเอียด</button></td></tr><tr><td class="person-cell"><strong>ผู้รับบริการตัวอย่าง 03</strong><span>SYN-HN-0087</span></td><td>${badge("สาขา B")}</td><td>${status("เสนอแล้ว", "pending")}</td><td>2 รายการ</td><td>ตามสิทธิ์</td><td>ตามสิทธิ์</td><td><button class="text-btn" data-action="open-plan">ติดตามข้อเสนอ</button></td></tr><tr><td class="person-cell"><strong>ผู้รับบริการตัวอย่าง 04</strong><span>SYN-HN-0118</span></td><td>${badge("สาขา C")}</td><td>${status("เสร็จสิ้น", "done")}</td><td>4 รายการ</td><td>ตามสิทธิ์</td><td>฿ 0</td><td><button class="text-btn" data-action="open-plan">ดู timeline</button></td></tr></tbody></table></div></div>`;

ion"><section class="card card-pad"><div class="card-head"><div><h2>กติกาความเสี่ยง</h2><p>แสดงเหตุผลและ owner ไม่ใช่สีอย่างเดียว</p></div><span class="status pending">รอ policy</span></div><div class="task-list"><div class="task-item"><span class="task-marker danger"></span><div class="task-copy"><strong>กำหนดรับชนหรือเลยวันนัดใส่</strong><span>ต้องแจ้งผู้รับผิดชอบและคำนวณใหม่เมื่อมีการเปลี่ยนวัน</span></div></div><div class="task-item"><span class="task-marker"></span><div class="task-copy"><strong>buffer ต่ำกว่า threshold</strong><span>ต้นแบบใช้ 2 วัน · production ต้องให้ owner อนุมัติ threshold</span></div></div><div class="task-item"><span class="task-marker info"></span><div class="task-copy"><strong>ส่งซ่อม / แก้งาน</strong><span>สร้าง revision ใหม่ เก็บเหตุผลและ history เดิมแบบอ่านอย่างเดียว</span></div></div></div></section><section class="card card-pad"><div class="card-head"><div><h2>ตรวจล่วงหน้า 3 วัน</h2><p>ช่วงเวลาที่ทีมยังมีทางเลือกในการประสานงาน</p></div><button class="action-link" data-action="open-lab-list">เปิดรายการ</button></div><div class="insight-strip" style="margin-top:0"><div class="insight-icon">${icon("calendar", 15)}</div><div><strong>3 เคสมีนัดใส่ในช่วงใกล้</strong><span>ตรวจ due date, fitting appointment และปลายทางของงานก่อนเริ่มวัน</span></div></div><div class="protected-box"><strong>${icon("lock", 14)} Approval mode</strong><p>ยังไม่ hard-block การนัดใส่จนกว่า clinical owner จะตัดสิน policy</p></div></section></div>`;

    function metricMini(label, value, ic, note, pending) {

    function hbar(label, colorVar, val, max, valText, active) {

="person-cell"><strong>ผู้ใช้สมมติ 01</strong><span>effective 01 ก.ย. 2569</span></td><td>Counter</td><td>${badge("A")}${badge("B")}</td><td><span class="permission-pill">● จำเป็นต่อการทำงาน</span></td><td><span class="permission-pill">● รับชำระ</span></td><td><span class="permission-pill restricted">— จำกัด</span></td><td>${status("Active", "confirmed")}</td></tr><tr><td class="person-cell"><strong>ผู้ใช้สมมติ 02</strong><span>effective 10 ก.ย. 2569</span></td><td>Dentist</td><td>${badge("B")}</td><td><span class="permission-pill">● เคสที่มอบหมาย</span></td><td><span class="permission-pill restricted">— ไม่ได้</span></td><td><span class="permission-pill restricted">— ไม่ได้</span></td><td>${status("Active", "confirmed")}</td></tr><tr><td class="person-cell"><strong>ผู้ใช้สมมติ 03</strong><span>effective 02 ส.ค. 2569</span></td><td>Finance</td><td>${badge("A")}${badge("B")}${badge("C")}</td><td><span class="permission-pill restricted">— ไม่ได้</span></td><td><span class="permission-pill">● ตาม scope</span></td><td><span class="permission-pill">● ตาม policy</span></td><td>${status("Review", "pending")}</td></tr></tbody></table></div></div><div class="prototype-footer">server-side tenant/branch isolation, role enforcement และ audit log ต้องมีจริงก่อนใช้ production</div>`;

    function renderView() {
      const views = { dashboard: renderDashboard, schedule: renderSchedule, queue: renderQueue, patients: renderPatients, treatment: renderTreatment, labs: renderLabs, finance: renderFinance, inbox: renderInbox, reports: renderReports, settings: renderSettings };
      const renderer = views[state.view] || renderDashboard;
      document.getElementById("appContent").innerHTML = renderer();
      document.querySelectorAll(".nav-item").forEach(button => button.classList.toggle("active", button.dataset.view === state.view || (state.view === "queue" && button.dataset.view === "schedule")));
      hydrateIcons(document.getElementById("appContent"));
      bindDynamicActions();
      bindCharts(document.getElementById("appContent"));
    }

    function renderBranchMenu() {
      const menu = document.getElementById("branchMenu");
      menu.innerHTML = branches.map(branch => `<button class="branch-option ${branch.key === state.branch ? "selected" : ""}" data-select-branch="${branch.key}" role="option" aria-selected="${branch.key === state.branch}"><span class="branch-dot" style="background:${branch.color}"></span><span class="option-copy"><strong>${branch.label}</strong><small>${branch.sub}</small></span>${branch.key === state.branch ? `<span class="check">✓</span>` : ""}</button>`).join("");
      menu.querySelectorAll("[data-select-branch]").forEach(button => button.addEventListener("click", () => {
        state.branch = button.dataset.selectBranch;
        state.selectedPatient = 0;
        state.selectedConversation = 0;
        closeBranchMenu();
        updateBranchTrigger();
        renderView();
        toast(`เปลี่ยนมุมมองเป็น ${currentBranch().label}`);
      }));
    }

    function updateBranchTrigger() {
      const branch = currentBranch();
      document.getElementById("branchLabel").textContent = branch.label;
      document.getElementById("branchSub").textContent = branch.sub;
      document.querySelector("#branchTrigger .branch-dot").style.background = branch.color;
      renderBranchMenu();
    }

    function closeBranchMenu() {
      const trigger = document.getElementById("branchTrigger");
      const menu = document.getElementById("branchMenu");
      menu.hidden = true;
      trigger.setAttribute("aria-expanded", "false");
    }

    function openModal(content) {
      const root = document.getElementById("modalRoot");
      root.innerHTML = `<div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${content}</div>`;
      root.hidden = false;
      state.modalOpen = true;
      hydrateIcons(root);
      root.querySelector("[data-close-modal]")?.focus();
    }

    function closeModal() {
      const root = document.getElementById("modalRoot");
      root.hidden = true;
      root.innerHTML = "";
      state.modalOpen = false;
    }

    function appointmentModal(id) {
      const appt = appointments.find(item => item.id === id) || appointments[0];
      openModal(`<div class="modal-head"><div><h2 id="modalTitle">นัดหมาย ${appt.id}</h2><p>${appt.time} · ${appt.duration} · ${branchName(appt.branch)}</p></div><button class="icon-btn" data-close-modal aria-label="ปิด"><span data-icon="close"></span></button></div><div class="modal-body"><div class="detail-grid"><div class="detail-item"><span>คนไข้</span><strong>${appt.patient}<br><small style="color:var(--muted);font-weight:500">${appt.hn}</small></strong></div><div class="detail-item"><span>สถานะ</span><strong>${status(appt.status, appt.statusClass)}</strong></div><div class="detail-item"><span>หัตถการ</span><strong>${appt.procedure}</strong></div><div class="detail-item"><span>สาขา</span><strong>${branchName(appt.branch)}</strong></div><div class="detail-item"><span>เก้าอี้</span><strong>${appt.chair}</strong></div><div class="detail-item"><span>ทันตแพทย์</span><strong>${appt.provider}</strong></div><div class="detail-item"><span>ช่องทาง</span><strong>${appt.source}</strong></div><div class="detail-item"><span>Consent</span><strong>ตรวจตาม role</strong></div></div><div class="modal-note">การยืนยันจริงต้องตรวจและล็อกเก้าอี้ + ทันตแพทย์ที่ server หาก slot ถูกใช้ไปแล้วต้องแสดง conflict และเสนอเวลาทางเลือก</div><div class="modal-actions"><button class="secondary-btn" data-action="reschedule">เลื่อนนัด</button><button class="secondary-btn" data-action="cancel-appointment">ยกเลิก</button><button class="primary-btn" data-action="check-in">เช็กอิน</button></div></div>`);
    }

    function labModal(id) {
      const lab = labs.find(item => item.id === id) || labs[0];
      openModal(`<div class="modal-head"><div><h2 id="modalTitle">${lab.title}</h2><p>${lab.id} · ${branchName(lab.branch)} · ${lab.lab}</p></div><button class="icon-btn" data-close-modal aria-label="ปิด"><span data-icon="close"></span></button></div><div class="modal-body"><div class="detail-grid"><div class="detail-item"><span>สถานะ</span><strong>${lab.stage === "sent" ? "ส่งแล็บแล้ว" : lab.stage === "production" ? "กำลังผลิต" : lab.stage === "shipping" ? "กำลังส่งกลับ" : lab.stage === "clinic" ? "ถึงคลินิกแล้ว" : "ใส่เสร็จ"}</strong></div><div class="detail-item"><span>ประเภทงาน</span><strong>${lab.type}</strong></div><div class="detail-item"><span>สาขาต้นทาง → ปลายทาง</span><strong>${branchName(lab.branch)} → ${branchName(lab.branch)}</strong></div><div class="detail-item"><span>กำหนดรับ</span><strong>${lab.due}</strong></div><div class="detail-item"><span>วันนัดใส่</span><strong>${lab.fitting}</strong></div><div class="detail-item"><span>revision</span><strong>ครั้งที่ 1 · ดู history</strong></div></div>${lab.risk ? `<div class="modal-note" style="border-color:#eec8c4;background:var(--danger-soft);color:var(--danger)"><strong>Risk flag:</strong> ${lab.risk}. ต้องแจ้ง owner และคำนวณใหม่เมื่อมีการเปลี่ยนวัน/สาขา</div>` : `<div class="protected-box">${icon("shield", 14)} ยังไม่พบ risk flag จากข้อมูลตัวอย่าง</div>`}<div class="modal-actions"><button class="secondary-btn" data-action="lab-contact">ติดต่อผู้รับผิดชอบ</button><button class="secondary-btn" data-action="lab-revision">สร้าง revision</button><button class="primary-btn" data-action="lab-approval">เปิด approval</button></div></div>`);

      openModal(`<div class="modal-head"><div><h2 id="modalTitle">${patient.name}</h2><p>Patient 360 · ${patient.id} · ${branchName(patient.branch)}</p></div><button class="icon-btn" data-close-modal aria-label="ปิด"><span data-icon="close"></span></button></div><div class="modal-body"><div class="detail-grid"><div class="detail-item"><span>Master record</span><strong>ภายใน tenant เดียว</strong></div><div class="detail-item"><span>สาขาที่เกี่ยวข้อง</span><strong>A · B · ตามสิทธิ์</strong></div><div class="detail-item"><span>นัดถัดไป</span><strong>${patient.next}</strong></div><div class="detail-item"><span>แผน</span><strong>${patient.plan}</strong></div><div class="detail-item"><span>Family / Guardian</span><strong>เชื่อมแล้ว · ตรวจตาม role</strong></div><div class="detail-item"><span>Consent</span><strong>${patient.consent}</strong></div></div><div class="protected-box"><strong>${icon("lock", 14)} Clinical tabs protected</strong><p>ข้อมูลโรคประจำตัว, ยาประจำ, แพ้ยา/สาร, odontogram และ X-ray ต้องผ่าน role/assignment/consent gate</p></div><div class="modal-actions"><button class="secondary-btn" data-action="request-consent">ขอ consent เพิ่ม</button><button class="primary-btn" data-close-modal>กลับไป Patient 360</button></div></div>`);
    }

    function bindDynamicActions() {
      document.querySelectorAll("[data-view]").forEach(element => element.addEventListener("click", event => {
        event.stopPropagation();
        const view = element.dataset.view;
        if (!view) return;
        state.view = view;
        document.body.classList.remove("nav-open");
        renderView();
      }));
      document.querySelectorAll("[data-branch]").forEach(element => element.addEventListener("click", event => {
        event.stopPropagation();
        state.branch = element.dataset.branch;
        updateBranchTrigger();
        renderView();
        toast(`เปิดมุมมอง ${currentBranch().label}`);
      }));
      document.querySelectorAll("[data-appointment]").forEach(element => element.addEventListener("click", event => {
        event.stopPropagation();
        appointmentModal(element.dataset.appointment);
      }));
      document.querySelectorAll("[data-lab]").forEach(element => element.addEventListener("click", event => {
        event.stopPropagation();
        labModal(element.dataset.lab);
      }));
      document.querySelectorAll("[data-patient-index]").forEach(element => element.addEventListener("click", event => {
        event.stopPropagation();
        state.selectedPatient = Number(element.dataset.patientIndex);
        renderView();
      }));
      document.querySelectorAll("[data-conversation-index]").forEach(element => element.addEventListener("click", event => {
        event.stopPropagation();
        state.selectedConversation = Number(element.dataset.conversationIndex);
        renderView();
      }));
      document.querySelectorAll("[data-report-tab]").forEach(element => element.addEventListener("click", event => {
        event.stopPropagation();
        state.reportTab = element.dataset.reportTab;
        renderView();
      }));
      document.querySelectorAll("[data-action]").forEach(element => element.addEventListener("click", event => {
        event.stopPropagation();
        handleAction(element.dataset.action, element.dataset.label);
      }));
      hydrateIcons(document);
    }

        "lab-contact": () => toast("ส่งงานให้ผู้รับผิดชอบ · ต้องมี audit event"),
        "lab-revision": () => toast("สร้าง revision ใหม่โดยคง history เดิม"),
        "lab-approval": () => toast("เปิด approval drawer · policy ยังรอการอนุมัติ"),
        "new-payment": () => toast("Prototype: รับชำระต้องระบุสาขาให้บริการ/รับชำระ"),
        "export-blocked": () => toast("Export ต้องตรวจสิทธิ์, branch scope และ retention ก่อน"),
        "open-approval": () => openModal(`<div class="modal-head"><div><h2 id="modalTitle">Approval drawer</h2><p>แก้บิล / DF ต้องมีเหตุผลและ audit trail</p></div><button class="icon-btn" data-close-modal aria-label="ปิด"><span data-icon="close"></span></button></div><div class="modal-body"><div class="detail-grid"><div class="detail-item"><span>ก่อนแก้</span><strong>ข้อมูลตามรายการเดิม</strong></div><div class="detail-item"><span>หลังแก้</span><strong>รอผู้อนุมัติกรอก</strong></div><div class="detail-item"><span>ผู้ร้องขอ</span><strong>ผู้ใช้สมมติ · Finance</strong></div><div class="detail-item"><span>สิ่งที่ได้รับผลกระทบ</span><strong>Invoice · Receipt · DF</strong></div></div><div class="modal-note">ห้ามลบรายการเดิมเพื่อแก้ยอดย้อนหลัง ต้องเพิ่ม adjustment event พร้อม reason และ approver</div><div class="modal-actions"><button class="secondary-btn" data-close-modal>ยกเลิก</button><button class="primary-btn" data-action="submit-approval">ส่งขออนุมัติ</button></div></div>`),
        "open-df-policy": () => toast("DF policy: ฐานคำนวณและ rule ต้องมาจากข้อตกลงที่อนุมัติ"),
        "open-invoice": () => toast("เปิด invoice detail พร้อม service/pay branch context"),
        "inbox-filter": () => toast("กรองบทสนทนา: รอคนรับช่วง"),
        "assign-inbox": () => toast("มอบหมายงานพร้อมคง transcript + branch context"),
        "edit-draft": () => toast("แก้ draft ได้ · AI confidence ไม่ใช่สิทธิ์ตอบ clinical"),
        "send-reply": () => toast("ส่งข้อความจาก approved source แล้ว · prototype"),
        "handoff": () => toast("ส่งต่อคนจริงแล้ว · transcript และ context ถูกคงไว้"),
        "report-schedule": () => toast("ตั้งเวลารายงานตาม scope และ permission"),
        "add-branch": () => toast("Prototype: เพิ่มสาขาพร้อม entitlement check"),
        "edit-branch": () => toast("แก้สาขาต้องสร้าง audit event และไม่ลบธุรกรรมเดิม"),
        "open-audit": () => toast("เปิด audit log: actor, role, branch, object, action, time"),
        "open-policy": () => toast("เปิด policy center · มี open decisions แสดงเป็น badge"),
        "access-review": () => toast("ทบทวน session / role / branch membership"),
        "confirm-slot": () => toast("ต้องเลือก branch และเช็ก slot จริงจาก server ก่อนยืนยัน"),
        "reschedule": () => toast("เลื่อนนัดต้องตรวจ resource impact และบันทึกเหตุผล"),
        "cancel-appointment": () => toast("ยกเลิกนัดต้องใช้ policy no-show / deposit / refund"),
        "check-in": () => toast("เช็กอินต้องยืนยัน branch + appointment ก่อนสร้าง encounter"),
        "submit-approval": () => { closeModal(); toast("ส่ง approval แล้ว · audit event ถูกสร้างใน prototype"); }
      };
      if (actionMap[action]) actionMap[action](); else toast(`Prototype action: ${action}`);
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
    }

    document.addEventListener("click", event => {
      const target = event.target;
      if (target.closest("[data-close-modal]") || target.id === "modalRoot") closeModal();
      if (!target.closest(".branch-wrap")) closeBranchMenu();
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape") { closeModal(); closeBranchMenu(); } });
    document.getElementById("branchTrigger").addEventListener("click", () => {
      const trigger = document.getElementById("branchTrigger");
      const menu = document.getElementById("branchMenu");
      menu.hidden = !menu.hidden;
      trigger.setAttribute("aria-expanded", String(!menu.hidden));
    });
    document.getElementById("mobileMenu").addEventListener("click", () => document.body.classList.toggle("nav-open"));
    document.getElementById("notifyButton").addEventListener("click", () => toast("มี 3 งานที่ต้องตรวจ · lab risk, นัดรอยืนยัน และ DF review"));
    document.getElementById("createButton").addEventListener("click", () => handleAction("create-appointment"));
    document.getElementById("globalSearch").addEventListener("keydown", event => { if (event.key === "Enter" && event.target.value.trim()) toast(`ค้นหา “${event.target.value.trim()}” · prototype scope`); });

    hydrateIcons(document);
    updateBranchTrigger();
    renderView();
  </script>
</body>
</html>
